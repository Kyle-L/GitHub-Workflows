# Dependabot Auto-merge Action
# 
# Automatically enables auto-merge for Dependabot pull requests using the GitHub CLI.
#
# Usage Example:
# --------------
# name: Dependabot Auto Merge
# on: pull_request

# permissions:
#   checks: read
#   contents: write
#   pull-requests: write

# jobs:
#   dependabot:
#     runs-on: ubuntu-latest
#     if: github.actor == 'dependabot[bot]'
#     steps:
#       - name: Enable auto-merge for Dependabot PRs
#         uses: Kyle-L/GitHub-Workflows/.github/actions/dependabot-auto-merge@main
#         env:
#           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: 'Dependabot Auto-merge'
description: 'Wait for required CI checks, then enable Dependabot auto-merge using GitHub CLI'

inputs:
  require-checks:
    description: 'Wait for all required status checks to pass before enabling auto-merge'
    required: false
    default: 'true'

branding:
  icon: 'git-merge'
  color: 'blue'

runs:
  using: 'composite'
  steps:
    - name: Wait for required CI checks
      if: github.actor == 'dependabot[bot]' && inputs.require-checks == 'true'
      shell: bash
      run: gh pr checks "$PR_URL" --required --watch --fail-fast
      env:
        GH_TOKEN: ${{ github.token }}
        PR_URL: ${{ github.event.pull_request.html_url }}

    - name: Enable auto-merge for Dependabot PRs
      if: github.actor == 'dependabot[bot]'
      shell: bash
      run: gh pr merge --auto --merge "$PR_URL"
      env:
        PR_URL: ${{ github.event.pull_request.html_url }}
        # GITHUB_TOKEN should be provided by the calling workflow
