# Dependabot Auto-merge Action
# 
# Automatically enables auto-merge for Dependabot pull requests using the GitHub CLI.
#
# Usage Example:
# --------------
# name: Dependabot Auto Merge
# on: pull_request

# permissions:
#   contents: write
#   pull-requests: write

# jobs:
#   dependabot:
#     runs-on: ubuntu-latest
#     if: github.actor == 'dependabot[bot]'
#     steps:
#       - name: Enable auto-merge for Dependabot PRs
#         uses: Kyle-L/GitHub-Workflows/.github/actions/dependabot-auto-merge@main
#         env:
#           GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: 'Dependabot Auto-merge'
description: 'Enable GitHub auto-merge for Dependabot pull requests'

branding:
  icon: 'git-merge'
  color: 'blue'

runs:
  using: 'composite'
  steps:
    - name: Enable auto-merge for Dependabot PRs
      if: github.actor == 'dependabot[bot]'
      shell: bash
      run: |
        gh api graphql \
          -f query='mutation($pullRequestId: ID!, $mergeMethod: PullRequestMergeMethod!) { enablePullRequestAutoMerge(input: {pullRequestId: $pullRequestId, mergeMethod: $mergeMethod}) { pullRequest { id } } }' \
          -F pullRequestId="$PULL_REQUEST_ID" \
          -F mergeMethod=MERGE
      env:
        GH_TOKEN: ${{ github.token }}
        PULL_REQUEST_ID: ${{ github.event.pull_request.node_id }}
