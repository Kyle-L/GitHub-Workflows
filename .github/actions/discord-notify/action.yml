name: 'Discord Notification'
description: 'Send a Discord notification with commit info and dynamic image'

inputs:
  webhook:
    description: 'Discord webhook URL'
    required: true
  status:
    description: 'Status of the workflow (starting, success, failure, cancelled, live)'
    required: true
  title:
    description: 'Title for the notification'
    required: true
  description:
    description: 'Description for the notification'
    required: false
    default: ''
  commit_sha:
    description: 'Full commit SHA'
    required: true
  author_name:
    description: 'Author username'
    required: true
  repository:
    description: 'Repository (owner/repo)'
    required: true
  server_url:
    description: 'GitHub server URL'
    required: true
  run_id:
    description: 'Workflow run ID'
    required: true
  template:
    description: 'Notification template: banner (default), issue, minimal'
    required: false
    default: 'banner'

runs:
  using: 'composite'
  steps:
    - name: Get commit info
      id: vars
      shell: bash
      run: |
        SHORT_SHA="${{ inputs.commit_sha }}"
        SHORT_SHA="${SHORT_SHA::8}"
        echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

        AUTHOR="${{ inputs.author_name }}"
        if [ -z "$AUTHOR" ]; then
          AUTHOR="Unknown"
        fi
        echo "author=$AUTHOR" >> $GITHUB_OUTPUT

        TITLE="${{ inputs.title }}"
        ENCODED_TITLE=$(echo "$TITLE" | sed 's/ /+/g' | sed 's/[^a-zA-Z0-9+_-]//g')
        if [ -z "$ENCODED_TITLE" ]; then
          ENCODED_TITLE="Update"
        fi
        echo "encoded_title=$ENCODED_TITLE" >> $GITHUB_OUTPUT

        case "${{ inputs.status }}" in
          starting)
            echo "color=3447003" >> $GITHUB_OUTPUT
            echo "gradient_from=1a5276" >> $GITHUB_OUTPUT
            echo "gradient_to=2874a6" >> $GITHUB_OUTPUT
            echo "text_color=FFFFFF" >> $GITHUB_OUTPUT
            echo "status_emoji=🔵" >> $GITHUB_OUTPUT
            ;;
          success)
            echo "color=3066993" >> $GITHUB_OUTPUT
            echo "gradient_from=196f3d" >> $GITHUB_OUTPUT
            echo "gradient_to=28a745" >> $GITHUB_OUTPUT
            echo "text_color=FFFFFF" >> $GITHUB_OUTPUT
            echo "status_emoji=✅" >> $GITHUB_OUTPUT
            ;;
          failure)
            echo "color=15158332" >> $GITHUB_OUTPUT
            echo "gradient_from=922b21" >> $GITHUB_OUTPUT
            echo "gradient_to=dc3545" >> $GITHUB_OUTPUT
            echo "text_color=FFFFFF" >> $GITHUB_OUTPUT
            echo "status_emoji=❌" >> $GITHUB_OUTPUT
            ;;
          cancelled)
            echo "color=9807270" >> $GITHUB_OUTPUT
            echo "gradient_from=4d5656" >> $GITHUB_OUTPUT
            echo "gradient_to=6c757d" >> $GITHUB_OUTPUT
            echo "text_color=FFFFFF" >> $GITHUB_OUTPUT
            echo "status_emoji=⏹️" >> $GITHUB_OUTPUT
            ;;
          live)
            echo "color=10181046" >> $GITHUB_OUTPUT
            echo "gradient_from=6c3483" >> $GITHUB_OUTPUT
            echo "gradient_to=9966cc" >> $GITHUB_OUTPUT
            echo "text_color=FFFFFF" >> $GITHUB_OUTPUT
            echo "status_emoji=🟣" >> $GITHUB_OUTPUT
            ;;
          *)
            echo "color=3447003" >> $GITHUB_OUTPUT
            echo "gradient_from=1a5276" >> $GITHUB_OUTPUT
            echo "gradient_to=2874a6" >> $GITHUB_OUTPUT
            echo "text_color=FFFFFF" >> $GITHUB_OUTPUT
            echo "status_emoji=🔵" >> $GITHUB_OUTPUT
            ;;
        esac

    - name: Build embed JSON
      id: embed
      shell: bash
      run: |
        TITLE="${{ inputs.title }}"
        DESC="${{ inputs.description }}"
        AUTHOR="${{ steps.vars.outputs.author }}"
        SHORT_SHA="${{ steps.vars.outputs.short_sha }}"
        COMMIT_SHA="${{ inputs.commit_sha }}"
        REPO="${{ inputs.repository }}"
        SERVER_URL="${{ inputs.server_url }}"
        RUN_ID="${{ inputs.run_id }}"
        COLOR="${{ steps.vars.outputs.color }}"
        GRADIENT_FROM="${{ steps.vars.outputs.gradient_from }}"
        GRADIENT_TO="${{ steps.vars.outputs.gradient_to }}"
        TEXT_COLOR="${{ steps.vars.outputs.text_color }}"
        ENCODED_TITLE="${{ steps.vars.outputs.encoded_title }}"
        STATUS_EMOJI="${{ steps.vars.outputs.status_emoji }}"

        COMMIT_URL="$SERVER_URL/$REPO/commit/$COMMIT_SHA"
        RUN_URL="$SERVER_URL/$REPO/actions/runs/$RUN_ID"
        BANNER_URL="https://via.assets.so/img.jpg?w=1200&h=200&gradientFrom=$GRADIENT_FROM&gradientTo=$GRADIENT_TO&gradientAngle=135&text=$ENCODED_TITLE&textColor=$TEXT_COLOR&f=png"

        case "${{ inputs.template }}" in
          issue)
            # Orange banner (hardcoded), ⚠️ prefix, author shown as "Opened by"
            ISSUE_BANNER_URL="https://via.assets.so/img.jpg?w=1200&h=200&gradientFrom=9a4400&gradientTo=e67e22&gradientAngle=135&text=$ENCODED_TITLE&textColor=FFFFFF&f=png"
            EMBEDS="[{\"title\":\"⚠️ $TITLE\",\"description\":\"$DESC\",\"color\":15105570,\"image\":{\"url\":\"$ISSUE_BANNER_URL\"},\"fields\":[{\"name\":\"Commit\",\"value\":\"[\`$SHORT_SHA\`]($COMMIT_URL)\",\"inline\":true},{\"name\":\"Opened by\",\"value\":\"$AUTHOR\",\"inline\":true},{\"name\":\"Workflow\",\"value\":\"[View Run]($RUN_URL)\"}]}]"
            ;;
          minimal)
            # No image, emoji prefix, all three fields inline in one compact row
            EMBEDS="[{\"title\":\"$STATUS_EMOJI $TITLE\",\"description\":\"$DESC\",\"color\":$COLOR,\"fields\":[{\"name\":\"Commit\",\"value\":\"[\`$SHORT_SHA\`]($COMMIT_URL)\",\"inline\":true},{\"name\":\"Author\",\"value\":\"$AUTHOR\",\"inline\":true},{\"name\":\"Workflow\",\"value\":\"[View Run]($RUN_URL)\",\"inline\":true}]}]"
            ;;
          banner|*)
            # Gradient banner image, commit + author inline, workflow run full-width
            EMBEDS="[{\"title\":\"$TITLE\",\"description\":\"$DESC\",\"color\":$COLOR,\"image\":{\"url\":\"$BANNER_URL\"},\"fields\":[{\"name\":\"Commit\",\"value\":\"[\`$SHORT_SHA\`]($COMMIT_URL)\",\"inline\":true},{\"name\":\"Author\",\"value\":\"$AUTHOR\",\"inline\":true},{\"name\":\"Workflow\",\"value\":\"[View Run]($RUN_URL)\"}]}]"
            ;;
        esac

        {
          echo 'embeds<<DISCORD_EMBEDS_EOF'
          echo "$EMBEDS"
          echo 'DISCORD_EMBEDS_EOF'
        } >> $GITHUB_OUTPUT

    - name: Send Discord notification
      uses: Ilshidur/action-discord@0.4.0
      continue-on-error: true
      env:
        DISCORD_WEBHOOK: ${{ inputs.webhook }}
        DISCORD_EMBEDS: ${{ steps.embed.outputs.embeds }}
      with:
        args: ''
